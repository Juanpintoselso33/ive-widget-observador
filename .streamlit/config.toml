# Configuracion de Streamlit — plataforma de widgets de El Observador

[browser]
gatherUsageStats = false

# ============================================================
# TEMA FIJO EN CLARO PARA LAS DOS APPS DEL REPO
# ============================================================
# El Figma "Producto UY" que pasó la diseñadora no tiene variante oscura, y es
# justamente el mock de estos widgets. Con la base oscura de Streamlit, el verde
# profundo del titular y del número del widget de seguridad queda ilegible, y
# elegir un verde alternativo para modo oscuro sería inventar una decisión de
# diseño que ella no tomó.
#
# NO ALCANZA CON `base = "light"`. Mientras existan las secciones [theme.light]
# y [theme.dark], Streamlit sigue la preferencia del sistema del lector y las
# aplica por encima de `base`: los desplegables seguían saliendo azul marino
# sobre el fondo blanco. Hay que dejar UNA sola paleta, sin secciones.
#
# CONSECUENCIA, y no es un efecto colateral escondido: el widget IVE, que está
# publicado, también deja de seguir el tema del sistema y queda siempre claro.
# Los valores de abajo son EXACTAMENTE los que tenía en [theme.light], así que
# para un lector en modo claro no cambia nada; el que cambia es el que tenía el
# sistema en oscuro.
#
# `primaryColor` PASÓ AL VERDE DEL FIGMA. Decía que seguía siendo el azul del
# IVE "que es quien lo usa", y eso valía mientras el IVE tenía su propia hoja;
# desde que también usa `get_observador_css()` no queda nadie usando el azul y
# lo que hacía era ensuciar las dos apps con un color que no está en el diseño.
# Es el ÚNICO lugar desde donde se puede pintar lo que Streamlit dibuja por su
# cuenta y no acepta CSS: el punto del radio del selector de preguntas de
# seguridad —ver la nota en `shared/styles.py`, que lo daba por perdido en azul—
# y los anillos de foco nativos.
[theme]
font = "sans serif"
base = "light"
primaryColor = "#006B36"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#121212"
