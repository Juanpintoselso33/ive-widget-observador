  Funciona en desktop y mobile, se adapta al ancho disponible.
  Reemplazá WIDGET_URL por la URL pública del widget en Streamlit Cloud.
-->

<!-- EMBED CODE - Copiar desde aquí -->

    src="WIDGET_URL"

</div>
<!-- FIN EMBED CODE -->


<!--
  INSTRUCCIONES:
  1. Reemplazá WIDGET_URL por la URL del widget (ej: https://tu-app.streamlit.app)
  2. Pegá el bloque entre los comentarios en el HTML del artículo
  3. El div externo centra el widget y lo limita a 700px en pantallas anchas
  4. En mobile el iframe ocupa el 100% del ancho disponible automáticamente
  5. Si el contenido se corta en altura, ajustá el valor height="900" (en px)

  VERSIÓN RESPONSIVE CON ALTURA AUTOMÁTICA (requiere JS):
  Usá el snippet de abajo si el CMS permite JavaScript inline.
-->

<!-- EMBED CON ALTURA AUTOMÁTICA (opcional, requiere JS) -->
<div id="ive-widget-container" style="width:100%;max-width:700px;margin:0 auto;">
  <iframe
    id="ive-widget"
    src="WIDGET_URL"
    title="¿Apoyás el IVE? Construí tu perfil — El Observador"
    width="100%"
    height="900"
    frameborder="0"
    scrolling="yes"
    style="display:block;border:none;"
    loading="lazy"
    allow="clipboard-write"
  ></iframe>
</div>
<script>
  (function() {
    var iframe = document.getElementById('ive-widget');
    function setHeight() {
      var w = iframe.offsetWidth;
      // En mobile (< 480px) usar más altura; en desktop menos
      iframe.height = w < 480 ? 1100 : 900;
    }
    setHeight();
    window.addEventListener('resize', setHeight);
  })();
</script>
<!-- FIN EMBED CON ALTURA AUTOMÁTICA -->
