<!--
  Código de embed para el widget IVE — El Observador

  La URL ya está puesta: https://juanpintoselso33-ive-widget-observador-app-poekzu.streamlit.app/


  LA URL DEL EMBED LLEVA `/~/+/` Y NO ES UN CAPRICHO. Pedida a secas, Streamlit
  Cloud no devuelve la app: devuelve un envoltorio suyo que carga la app en OTRO
  iframe adentro. Ese iframe anidado se redimensiona solo cuando la página está
  arriba de todo; metido dentro del iframe de la nota se queda en ~150px de alto
  y el widget aparece **cortado a la altura del título**, con el resto en blanco
  y una barra "Built with Streamlit / Fullscreen" al pie. Medido el 19/9/2026
  contra la app publicada, en una página que imita la columna del sitio.

  `/~/+/` es la ruta del iframe interno, o sea la app sin el envoltorio: entra
  entera y sin la barra. Es la misma que ya usaba `scripts/screenshot_app.py`
  para capturar la app.

  Si algún día el embebido apareciera cortado o mostrara esa barra, empezar por
  acá: es una ruta interna de Streamlit Cloud y puede cambiar sin aviso.

  HAY DOS VERSIONES:

    · COMPLETA — formulario, resultado, comparación por grupos y el desplegable
      del modelo. Es la de la nota.
    · CAJA (`?resumen=1`) — formulario y resultado, nada más. Es la que pidió
      Tomer el 18/9/2026 para que entre en una caja. No muestra la comparación
      ni la metodología, así que **su pie lleva el enlace a la versión completa**
      —que es donde están el promedio nacional y la ficha del modelo—, además
      del aviso de que el cálculo es entre quienes tienen postura definida y de
      los créditos de la UMAD y Juan Pablo Ferreira. Ese pie no es decorativo:
      es lo único que acompaña al número en la caja.

  LAS ALTURAS ESTÁN MEDIDAS DENTRO DE UN IFRAME REAL contra la app publicada
  (19/9/2026, Chrome, fuentes cargadas y scrolleado hasta el fondo):

      versión    iframe 700px   iframe ~368px (columna en celular)
      completa      1638            1828
      caja          1123            1142

  MEDIRLO SIN IFRAME DA NÚMEROS OPTIMISTAS Y RECORTA. La primera versión de
  este archivo traía 1721 para la completa en móvil, medido abriendo la app
  suelta con el viewport en 400: así el widget usa los 400px enteros, y
  embebido en una columna con padding le quedan ~368. Con 32px menos de ancho
  el texto ocupa más líneas y el contenido trepa a 1828 — o sea que el iframe
  de 1750 recortaba 78px de verdad, con `scrolling="no"` y sin forma de bajar.
  Si se cambia un texto, volver a medir ASÍ: un iframe corto no avisa, recorta.

  La completa CRECE en móvil —el titular y los textos ocupan más líneas— y la
  caja crece apenas. Ojo con la caja: pasa con 8px de sobra, es la más
  ajustada de las dos.
-->

<!-- ============================================================
     1) VERSIÓN COMPLETA — para la nota
     ============================================================
     UNA ALTURA FIJA TIENE QUE CUBRIR EL CASO PEOR, que es el MÓVIL: la versión
     completa mide 1828px embebida en una columna de celular y 1638 a 700, así
     que va 1860. Con el
     número de escritorio, un lector en celular perdía los últimos ~60px —el
     pie— y `scrolling="no"` no le dejaba ni bajar a verlos. Lo marcó el bot de
     Codex en el PR.
     Si sobra blanco abajo en escritorio y molesta, usá el snippet (3), que
     ajusta por ancho. -->
<div style="width:100%;max-width:700px;margin:0 auto;">
  <iframe
    src="https://juanpintoselso33-ive-widget-observador-app-poekzu.streamlit.app/~/+/?embed=true"
    title="¿Cuál es tu probabilidad de apoyar el derecho a la interrupción voluntaria del embarazo? — El Observador"
    width="100%"
    height="1860"
    frameborder="0"
    scrolling="no"
    style="display:block;border:none;"
    loading="lazy"
  ></iframe>
</div>

<!-- ============================================================
     2) VERSIÓN CAJA — formulario y resultado
     ============================================================
     Misma regla, y acá el caso peor también es el móvil: 1142 contra 1123. Va
     1180 en vez de los 1150 que tenía, que pasaban por 8px — demasiado poco
     para una pieza a la que todavía le pueden tocar un texto. -->

<div style="width:100%;max-width:700px;margin:0 auto;">
  <iframe
    src="https://juanpintoselso33-ive-widget-observador-app-poekzu.streamlit.app/~/+/?resumen=1&amp;embed=true"
    title="¿Cuál es tu probabilidad de apoyar el derecho a la interrupción voluntaria del embarazo? — El Observador"
    width="100%"
    height="1180"
    frameborder="0"
    scrolling="no"
    style="display:block;border:none;"
    loading="lazy"
  ></iframe>
</div>

<!-- ============================================================
     3) ALTURA SEGÚN EL ANCHO — si el CMS permite JavaScript
     ============================================================
     Las dos versiones se comportan al revés entre sí, así que el salto va en
     el sentido que corresponda a cada una. Los números salen de la tabla de
     arriba, con un margen de ~25px.

     LA VARIANTE SE DEDUCE DE LA URL, no de un atributo aparte. Antes había un
     `data-version="completa"` al lado de la URL completa, y era una trampa:
     cambiar sólo la URL a `?resumen=1` dejaba las alturas de la versión larga
     (mucho blanco abajo) y cambiar sólo el atributo recortaba la versión
     completa. Con un solo dato no se pueden contradecir.

     Sirve para las dos: pegá el bloque y, si querés la caja, agregale
     `?resumen=1&` a la URL. Para dos widgets en la misma nota, cambiá el id.
-->
<div style="width:100%;max-width:700px;margin:0 auto;">
  <iframe
    id="ive-widget"
    src="https://juanpintoselso33-ive-widget-observador-app-poekzu.streamlit.app/~/+/?embed=true"
    title="¿Cuál es tu probabilidad de apoyar el derecho a la interrupción voluntaria del embarazo? — El Observador"
    width="100%"
    height="1660"
    frameborder="0"
    scrolling="no"
    style="display:block;border:none;"
    loading="lazy"
  ></iframe>
</div>
<script>
  (function () {
    var iframe = document.getElementById('ive-widget');
    if (!iframe) return;
    // alto = [angosto (<480px), ancho]. La caja se ACHICA en pantalla angosta
    // y la completa CRECE: el titular ocupa más líneas y ella no lo compensa
    // sacando bloques.
    var ALTURAS = { completa: [1860, 1670], caja: [1180, 1160] };
    var esCaja = /[?&]resumen=(1|true|si|s%C3%AD)(&|$)/i.test(iframe.src);
    function ajustar() {
      var alturas = esCaja ? ALTURAS.caja : ALTURAS.completa;
      iframe.height = iframe.offsetWidth < 480 ? alturas[0] : alturas[1];
    }
    ajustar();
    window.addEventListener('resize', ajustar);
  })();
</script>

<!--
  NOTAS

  · `?embed=true` es de Streamlit: saca su barra superior y el menú.
  · `scrolling="no"` va junto con la altura completa. Si se prefiere un iframe
    más bajo con scroll interno, poner `scrolling="yes"` — pero en móvil el
    scroll anidado se pelea con el de la nota.
  · El widget ya es responsive y mantiene sus dos columnas de campos hasta
    400px, como el frame móvil del Figma.
-->
