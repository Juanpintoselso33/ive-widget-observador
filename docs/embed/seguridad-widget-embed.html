<!--
  ============================================================
  CÓDIGO DE EMBED — Widget de seguridad pública
  Encuesta El Observador-UMAD-Ferreira, mayo de 2026
  ============================================================

  La URL ya está puesta: https://observador-seguridad.streamlit.app/
  Esa app sigue la rama `master` del repo, así que sirve lo que esté mergeado.

  El `?embed=true` NO es opcional. Sin él, Streamlit dibuja su propia barra
  superior con el menú de hamburguesa y el botón de "Deploy": dentro de una nota
  se ve como un error, y el menú deja al lector reiniciar la app. Con
  `embed=true` queda sólo el contenido.

  ============================================================
  ALTURAS — medidas, no estimadas
  ============================================================
  Un iframe de otro dominio no deja que la página que lo contiene mida su
  contenido, así que el alto se fija a mano. Estos números salen de cargar el
  widget dentro de un iframe de cada ancho y recorrer LAS CUATRO PREGUNTAS una
  por una, quedándose con la más alta (9/9/2026, después del rediseño del Figma):

      ancho    alto del contenido (peor caso de las cuatro)
      331 px   2881
      375 px   2682
      420 px   2530
      640 px   2084
      698 px   2216
      720 px   2216
      900 px   2216

  DOS COSAS QUE CAMBIARON con el diseño del Figma y simplifican mucho esto:

  1. DE 698 PX PARA ARRIBA EL ALTO NO CAMBIA MÁS. El marco está topado en 698 px
     —es el ancho del frame de escritorio del diseño—, así que a 698, 720 y 900
     el contenido mide exactamente lo mismo. Para cualquier nota de escritorio
     alcanza UN SOLO número y no hace falta la variante que ajusta por ancho.

  2. EL SALTO ESTÁ EN 640, Y VA PARA ARRIBA. Hasta 640 px rige la consulta de
     móvil: tipografía de 16 px en vez de 19 y barra de 18 px en vez de 31, así
     que el contenido es MÁS BAJO (2084). Pasando de 640 vuelve a la tipografía
     de escritorio y sube a 2216. Es al revés que en el diseño anterior, donde
     el salto venía de apilar los selectores en una columna: ahora el móvil
     mantiene las dos columnas, como el frame de 331 px del Figma.

  Los valores de abajo llevan unos 45 px de margen sobre lo medido, para
  absorber la diferencia entre que las tipografías estén en caché o se bajen en
  el momento. Si se agrega una pregunta con un enunciado más largo que el de
  "cadena perpetua", hay que volver a medir.
-->


<!-- ============================================================
     1. NOTA — la del cuerpo del artículo. Copiar desde acá.
     ============================================================
     Un solo alto sirve para cualquier ancho de escritorio, porque el widget se
     topa en 698 px. Si la nota se lee sobre todo en celular, usar la variante 3.
-->
<div style="width:100%;max-width:698px;margin:2rem auto;">
  <iframe
    src="https://observador-seguridad.streamlit.app/?embed=true"
    title="¿Quiénes apoyan las medidas de mano dura en Uruguay? — El Observador"
    width="100%"
    height="2260"
    frameborder="0"
    scrolling="no"
    style="display:block;border:none;width:100%;"
    loading="lazy"
  ></iframe>
</div>


<!-- ============================================================
     2. HOME — versión compacta, para el módulo de portada.
     ============================================================
     Mismo widget, con el ancho de la caja de la home. Si la caja mide menos de
     640 px el widget entra en modo móvil y crece: usar la tabla de arriba.
-->
<div style="width:100%;max-width:698px;margin:0 auto;">
  <iframe
    src="https://observador-seguridad.streamlit.app/?embed=true"
    title="¿Quiénes apoyan las medidas de mano dura en Uruguay? — El Observador"
    width="100%"
    height="2260"
    frameborder="0"
    scrolling="no"
    style="display:block;border:none;width:100%;"
    loading="lazy"
  ></iframe>
</div>


<!-- ============================================================
     3. RESPONSIVE — ajusta el alto al ancho real del contenedor.
     ============================================================
     Es la que conviene si la nota se lee mayoritariamente en celular: con el
     alto fijo de escritorio, en un teléfono queda contenido cortado.

     Los cortes son los de la tabla de arriba, redondeados hacia arriba. El
     último tramo cubre todo lo que sea 641 px o más, porque de 698 en adelante
     el alto ya no cambia.
-->
<div style="width:100%;max-width:698px;margin:2rem auto;">
  <iframe
    id="widget-seguridad"
    src="https://observador-seguridad.streamlit.app/?embed=true"
    title="¿Quiénes apoyan las medidas de mano dura en Uruguay? — El Observador"
    width="100%"
    height="2260"
    frameborder="0"
    scrolling="no"
    style="display:block;border:none;width:100%;"
    loading="lazy"
  ></iframe>
</div>
<script>
(function () {
  var iframe = document.getElementById('widget-seguridad');
  if (!iframe) return;
  // [ancho máximo del contenedor, alto del iframe]. De 641 para arriba es
  // constante: el widget se topa en 698 px de ancho.
  var ALTOS = [[340, 2930], [380, 2730], [430, 2580], [640, 2130]];
  function ajustar() {
    var ancho = iframe.parentElement.clientWidth;
    for (var i = 0; i < ALTOS.length; i++) {
      if (ancho <= ALTOS[i][0]) { iframe.height = ALTOS[i][1]; return; }
    }
    iframe.height = 2260;
  }
  ajustar();
  window.addEventListener('resize', ajustar);
})();
</script>
